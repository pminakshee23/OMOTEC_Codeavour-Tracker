<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>OMOTEC Codeavour Tracker – Codeavour 8.0</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--o:#F36B05;--m:#96317F;--b:#145A99;--n:#062F67;--bg:#f3f5fa;--c:#fff;--t:#1b2540;--mu:#667290;--bd:#e1e6f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1426;--c:#16203a;--t:#eaf0ff;--mu:#9aa8c7;--bd:#2a3555}}
:root[data-theme="dark"]{--bg:#0d1426;--c:#16203a;--t:#eaf0ff;--mu:#9aa8c7;--bd:#2a3555}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,Segoe UI,Arial,sans-serif}
#app{display:flex;min-height:100vh}nav{width:210px;background:var(--n);color:#fff;padding:12px;flex-shrink:0}
nav h2{font-size:15px;margin:0}nav small{display:block;opacity:.75;margin-bottom:10px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#fff;padding:9px 10px;border-radius:10px;cursor:pointer;font:inherit;margin:1px 0}
nav button:hover{background:#ffffff22}nav button.on{background:var(--o)}
main{flex:1;min-width:0;padding:16px}.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.sp{flex:1}
input,select,textarea,.btn{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:9px;background:var(--c);color:var(--t)}
.btn{background:var(--b);color:#fff;border:0;cursor:pointer;font-weight:600}.btn.o{background:var(--o)}.btn.g{background:var(--bd);color:var(--t)}.btn.r{background:#d92d3a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--c);border-radius:14px;padding:12px;box-shadow:0 2px 10px #0001;margin-bottom:12px;border-top:3px solid var(--o)}
.k b{display:block;font-size:24px;color:var(--b)}.k span{color:var(--mu);font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px}
tr.h:hover{background:var(--bd);cursor:pointer}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--m));transition:width .6s}
.pill{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;color:#fff}.Green{background:#16a34a}.Yellow{background:#ca9a04}.Orange{background:var(--o)}.Red{background:#d92d3a}.Gray{background:#94a3b8}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}.sg button{border:0;border-radius:8px;padding:9px 0;font-weight:700;cursor:pointer;color:#fff}
.s0{background:#94a3b8}.s1{background:#8b5cf6}.s2{background:var(--b)}.s3{background:#16a34a}.s4{background:var(--o)}.s5{background:#ca9a04}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.sc{background:linear-gradient(135deg,var(--n),var(--b));color:#fff;border-radius:16px;padding:16px;text-align:center}.sc .n{font-size:46px;font-weight:800}
.big{font-size:20px;padding:12px 20px}.toast{position:fixed;bottom:18px;right:18px;background:var(--n);color:#fff;padding:10px 14px;border-radius:10px;z-index:9}
#login{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:14px}#login .card{max-width:360px;text-align:center}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:3px}nav h2,nav small{display:none}nav button{white-space:nowrap;width:auto}}

:root[data-theme="pastel"]{--o:#8B5CF6;--m:#38BDF8;--b:#8B5CF6;--n:#1E293B;--nv:#fff;--nt:#1E293B;--bg:#F8F7FF;--c:#fff;--t:#1E293B;--mu:#64748b;--bd:#ece8ff}
:root[data-theme="omotec"]{--o:#F36B05;--m:#96317F;--b:#145A99;--n:#062F67;--nv:#062F67;--nt:#fff;--bg:#f3f5fa;--c:#fff;--t:#1b2540;--mu:#667290;--bd:#e1e6f1}
:root[data-theme="pitch"]{--o:#16a34a;--m:#22c55e;--b:#15803d;--n:#14532d;--nv:#ecfdf3;--nt:#14532d;--bg:#ecfdf3;--c:#fff;--t:#14532d;--mu:#4d7c5f;--bd:#bbf7d0}
:root[data-theme="neon"]{--o:#a78bfa;--m:#22d3ee;--b:#7c3aed;--n:#0b1020;--nv:#141b34;--nt:#e6edff;--bg:#0b1020;--c:#141b34;--t:#e6edff;--mu:#93a1c7;--bd:#27315a}
:root[data-theme="sunset"]{--o:#f97316;--m:#ec4899;--b:#e11d48;--n:#431407;--nv:#fff7ed;--nt:#431407;--bg:#fff7ed;--c:#fff;--t:#431407;--mu:#9a5b3a;--bd:#fed7aa}
body{font-family:Inter,system-ui,sans-serif}h1,h2,h3{font-family:Poppins,sans-serif}
:root[data-theme="pastel"] body{background:radial-gradient(circle at 8% 0,#ede9fe,transparent 40%),radial-gradient(circle at 100% 15%,#e0f2fe,transparent 40%),var(--bg)}
:root[data-theme="pitch"] body{background:repeating-linear-gradient(90deg,#ecfdf3 0 80px,#dcfce7 80px 160px)}
:root[data-theme="neon"] body{background:radial-gradient(circle at 20% 0,#2a1b5e,transparent 45%),#0b1020}
:root[data-theme="sunset"] body{background:linear-gradient(160deg,#fff7ed,#fce7f3)}
nav{background:var(--nv);color:var(--nt);border-right:1px solid var(--bd)}nav button{color:var(--nt);border-radius:14px}nav button:hover{background:var(--bd)}nav button.on{background:var(--o);color:#fff}
.card{border-radius:20px;box-shadow:0 6px 20px #8b5cf622;border-top:4px solid var(--m)}.k{transition:.2s}.k:hover{transform:translateY(-3px)}.btn{border-radius:12px}
.hero{background:linear-gradient(135deg,var(--o),var(--m));color:#fff;border-radius:22px;padding:14px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.hero b{font:700 20px Poppins}.mc{font-size:30px;animation:bob 2s infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tab{border:0;padding:9px 16px;border-radius:99px;background:var(--c);color:var(--t);font:600 13px Inter;cursor:pointer;box-shadow:0 2px 8px #0001;transition:.2s}.tab:hover{transform:translateY(-2px)}.tab.on{background:var(--o);color:#fff}
.mascot{background:linear-gradient(135deg,var(--o),var(--m));color:#fff;border-radius:16px;padding:10px;text-align:center;margin-top:14px;font-weight:600;font-size:12px}
#m{animation:fade .35s}@keyframes fade{from{opacity:0;transform:translateY(8px)}}@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.3}}
.tl{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}.tl span{padding:3px 9px;border-radius:99px;font-size:11px;background:var(--bd);color:var(--mu)}.tl span.d{background:#16a34a;color:#fff}.tl span.c{background:var(--o);color:#fff;font-weight:700;animation:bob 2s infinite}
@media print{body *{visibility:hidden}#sheet,#sheet *{visibility:visible}#sheet{position:absolute;left:0;top:0;width:100%}}
canvas.sg{border:1px dashed var(--mu);border-radius:8px;touch-action:none;background:#fff}
@media(max-width:760px){.mascot,nav img{display:none}}
</style></head><body><div id="root"></div>

function reassignTeam(id){
 if(!U||U.role!=="admin")return toast("Only Super Admin can reassign teams");
 const t=S.teams.find(x=>x.id===id);if(!t)return toast("Team not found");
 const tr=document.getElementById("reassignTrainer"),pl=document.getElementById("reassignLead");
 if(!tr||!pl||!tr.value||!pl.value)return toast("Select an active trainer and lead");
 const a=S.users.find(u=>u.n===tr.value&&u.role==="trainer"&&u.st!=="Inactive");
 const b=S.users.find(u=>u.n===pl.value&&u.role==="lead"&&u.st!=="Inactive"&&(!u.trk||u.trk===t.trk));
 if(!a||!b)return toast("Selected trainer or lead is not eligible");
 const oldTr=t.tr,oldPl=t.pl;
 if(oldTr===a.n&&oldPl===b.n)return toast("No assignment changes");
 if(!confirm(`Reassign ${t.name}?\nTrainer: ${oldTr} → ${a.n}\nLead: ${oldPl} → ${b.n}`))return;
 t.tr=a.n;t.pl=b.n;
 log(`Team reassigned: trainer ${oldTr} → ${a.n}; lead ${oldPl} → ${b.n}`,id);
 save();toast("Team reassigned successfully");draw();
}

 if(!(U.role==='admin'||(U.role==='trainer'&&t&&t.tr===U.n)||(U.role==='lead'&&t&&t.trk===U.trk)))return toast('Access denied');

let omoTimerEndAt=0,omoTimerAudio=null;
function omoAlarm(){
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  if(!omoTimerAudio)omoTimerAudio=new C();
  omoTimerAudio.resume();
  const start=omoTimerAudio.currentTime;
  [0,.38,.76,1.14].forEach((delay,i)=>{
   const osc=omoTimerAudio.createOscillator(),gain=omoTimerAudio.createGain();
   osc.type='sine';osc.frequency.value=i%2?660:880;
   gain.gain.setValueAtTime(.0001,start+delay);
   gain.gain.exponentialRampToValueAtTime(.24,start+delay+.025);
   gain.gain.exponentialRampToValueAtTime(.0001,start+delay+.29);
   osc.connect(gain);gain.connect(omoTimerAudio.destination);
   osc.start(start+delay);osc.stop(start+delay+.3);
  });
 }catch(err){console.warn('Countdown sound unavailable',err)}
}
function omoShowCountdown(){
 if(!EVD)return;
 EVD.ptime=mmss(PVS);
 const el=document.getElementById('ptm');if(el)el.textContent=EVD.ptime;
}
omoSetCountdown=function(){
 if(!EVD)return;
 const m=Number(document.getElementById('evalPrMin')?.value),sec=Number(document.getElementById('evalPrSec')?.value);
 if(!Number.isInteger(m)||m<0||m>999||!Number.isInteger(sec)||sec<0||sec>59||m*60+sec<1)return toast('Enter a valid countdown (seconds 0–59)');
 clearInterval(PVI);PVI=null;omoTimerEndAt=0;
 PVS=m*60+sec;EVD.practiceDuration=PVS;omoCountdownFinished=false;omoShowCountdown();
 /* Unlock audio after the user presses Set Countdown, so the alarm can sound at zero. */
 try{const C=window.AudioContext||window.webkitAudioContext;if(C){omoTimerAudio=omoTimerAudio||new C();omoTimerAudio.resume()}}catch(err){}
 toast('Countdown set to '+mmss(PVS));
};
evTm=function(a,w){
 if(w!=='p')return omoOriginalEvTm(a,w);
 if(!EVD)return;
 if(a==='stop'||a==='pause'){
  if(PVI&&omoTimerEndAt)PVS=Math.max(0,Math.ceil((omoTimerEndAt-Date.now())/1000));
  clearInterval(PVI);PVI=null;omoTimerEndAt=0;omoShowCountdown();return;
 }
 if(a==='reset'){
  clearInterval(PVI);PVI=null;omoTimerEndAt=0;PVS=Number(EVD.practiceDuration)||0;omoCountdownFinished=false;omoShowCountdown();return;
 }
 if(a==='start'){
  clearInterval(PVI);PVI=null;omoTimerEndAt=0;PVS=Number(EVD.practiceDuration)||0;omoCountdownFinished=false;
 }
 if((a==='start'||a==='resume')&&PVS>0){
  clearInterval(PVI);omoTimerEndAt=Date.now()+PVS*1000;
  const tick=()=>{
   PVS=Math.max(0,Math.ceil((omoTimerEndAt-Date.now())/1000));omoShowCountdown();
   if(PVS===0){clearInterval(PVI);PVI=null;omoTimerEndAt=0;if(!omoCountdownFinished){omoCountdownFinished=true;omoAlarm();toast('Time is up!')}}
  };
  tick();PVI=setInterval(tick,150);
 }else if(PVS<=0)toast('Set minutes and seconds before starting');
};

  '$1<button class="btn r big" onclick="evTm(\'stop\',\'p\')">Stop</button>');
 return h;
};
